name: MonkeyKeyboard
options:
  bundleIdPrefix: com.monkey
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
targets:
  MonkeyKeyboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monkey.keyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Monkey Keyboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        MonkeyKeychainGroup: $(AppIdentifierPrefix)com.monkey.keyboard.shared
        NSLocalNetworkUsageDescription: 连接你的 Monkey 主机以生成候选回复。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: App/MonkeyKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.monkey.keyboard]
        keychain-access-groups: [$(AppIdentifierPrefix)com.monkey.keyboard.shared]
    dependencies:
      - target: KeyboardExtension
        embed: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monkey.keyboard.extension
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Monkey
        MonkeyKeychainGroup: $(AppIdentifierPrefix)com.monkey.keyboard.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
            PrefersRightToLeft: false
    entitlements:
      path: Keyboard/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.monkey.keyboard]
        keychain-access-groups: [$(AppIdentifierPrefix)com.monkey.keyboard.shared]
schemes:
  MonkeyKeyboard:
    build:
      targets:
        MonkeyKeyboard: all
